name: build-wheels

on:
  workflow_call:
    inputs:
      os:
        description: "OS to run on, must be one of supported runner type"
        required: true
        type: string
      build-target:
        description: "CIBW build target (e.g., cp310-manylinux_x86_64)"
        required: true
        type: string
      python-version:
        description: "Python version to install on host (e.g., 3.10)"
        required: true
        type: string

jobs:
  build-test:
    runs-on: ${{ inputs.os }}

    # Static cibuildwheel config lives in [tool.cibuildwheel] in pyproject.toml;
    # CI only selects the build target.
    env:
      CIBW_BUILD: ${{ inputs.build-target }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Required to use MSVC with Ninja
      - uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Build wheel
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload runtime wheels
        uses: actions/upload-artifact@v4
        with:
          name: vtk_streaming-${{ inputs.build-target }}
          path: |
            wheelhouse/vtk_streaming-*.whl
